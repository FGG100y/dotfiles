# ----------------------------------------------------------------------
# Extended keys (2026-08-16 新增，解决 pi coding agent 按键冲突警告)
# ----------------------------------------------------------------------
# 背景：tmux 默认会剥掉按键的修饰符信息。在 tmux 里跑 pi 时：
#   Enter      -> \r
#   Shift+Enter -> \r   （和 Enter 一样，无法区分！）
#   Ctrl+Enter  -> \r   （同上）
#   Alt+Enter   -> \x1b\r
#
# pi 的默认键位依赖区分这些按键：Enter = 提交，Shift+Enter = 换行。
# 不开 extended-keys 时，Shift+Enter / Ctrl+Enter 会被 pi 当成普通 Enter，
# 功能失效，pi 启动时也会提示 "warning tmux extended-keys is off"。
#
# 修复：
#   1. set -g extended-keys on                —— 开启扩展键转发
#   2. set -g extended-keys-format csi-u      —— 用 CSI-u 格式转发（最可靠）
#
# 注意事项：
#   - extended-keys-format csi-u 需要 tmux 3.5+，旧版本（如 3.2a）会报
#     "invalid option"，此时只能保留第一行（xterm modifyOtherKeys 格式，
#     pi 也支持）。
#   - 本机已从 apt 的 3.2a 升级到源码编译的 3.7b（~/.local/bin/tmux）。
#   - 修改后必须完全重启 tmux 才生效：tmux kill-server && tmux
#     （重启会杀掉所有会话，包括正在跑的 pi！）
set -g extended-keys on
set -g extended-keys-format csi-u

# rename tmux session name:
# # prefix + $
# rename tmux window name:
# # prefix + ,

# # Setting the default prefix C-b to C-a ----------------- {{{
set -g prefix C-a
# # unbind the C-b
unbind C-b
# # ensure that we can send Ctrl-a to other apps (e.g., vim)
bind C-a send-prefix
# # autocomlete
#bind-key C-space run -b 'tmux-autocomplete'
## reload the .tmux.conf file with Prefix-r
bind r source-file ~/.tmux.conf \; display "tmuxconf reloaded!"
# # https://www.seanh.cc/2021/01/02/change-between-light-and-dark-themes-in-tmux/
bind T run-shell ~/.tmux/bin/toggle-theme
# # swap panes
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one
# # setting the delay between prefix and command
# 2026-08-20: 1ms 在 SSH 下会导致 ESC 与后续字节被拆包时误判为孤立 Escape，
#   copy-mode 里触发 clear-selection → 复制静默失败（粘出旧内容）。50ms 验证有效。
set -s escape-time 50
# # Enable mouse so drag selection goes through tmux copy-mode.
set -g mouse on
# # vim mode
set -g status-keys vi
setw -g mode-keys vi
# # git-gutter requires focus events on
set -g focus-events on
# # Set the default terminal node to 256color mode
#set -g default-terminal "screen-256color"
set -g status-interval 60

set-option -g status-style bg=colour241

set -g window-status-style fg=colour246,bg=colour241
set -g window-status-current-style fg=colour40,bg=colour241,bold
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '

set -g status-left-length 100
set-option -g status-left "\
#[fg=colour246, bg=colour237]#{?client_prefix,#[bg=colour167],} 📚 #S \
#(~/.tmux/bin/battery_status.sh) \
"

set -g status-justify centre

set -g status-right-length 150
set-option -g status-right "\
#[fg=colour246, bg=colour237] #(hostname -I | cut -d ' ' -f1) ⫷ \
#[fg=colour246, bg=colour237] %a %m-%d '%y \
#[fg=colour214, bg=colour237] %H:%M \
"

# WEATHER='#(curl -s wttr.in/Guangzhou\?format\=1)'
# set -g status-right "#[fg=k]%a %F, %R $WEATHER"
# # }}}

setw -g status-position top

# # Splitting Panes ------------ {{{
# # splitting panes -hb,-vb (vim-split style) or just -h,-v
bind | split-window -hb -c "#{pane_current_path}"
bind - split-window -vb -c "#{pane_current_path}"
# # }}}

# # Resizing Panes ------- {{{
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# # }}}

# # copy && system clipboard group ------- {{{
# 2026-08-20 清理：删除 xclip 绑定。
#   - tmux 3.2+ 的 set-clipboard on（见文件末尾）已覆盖复制到系统剪贴板；
#   - 本机 DISPLAY=:0 且 X 是活的，xclip 会把内容写进"这台机器"的 X
#     剪贴板——SSH 客户端那头看不到，还泄漏常驻 xclip 进程。
# # }}}

# # The tmux <<>> vim jumpping group ----------------------------------------------------------------- {{{
# # 日 06 11月 2022 22:10:58 | last update
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
        "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
            "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# # Mon 07 Feb 2022 22:26:44 | Update
# # integrating seamlessly with Vim, using this snip and disable the plugin setting
