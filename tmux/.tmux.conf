# # The tpm group ----------------------------------------------------------------- {{{
# # tpm is a tmux-plugin manager.
# # Quick Ref:
# # Installing plugins:
# #     1. add new plugin to .tmux.conf with `set -g @plugin ...`
# #     2. press `prefix + I` (capital i, as Install) to fetch the plugin.
# # See details in [github repos](github.com/tmux-plugins/tpm)
set -g @plugin 'tmux-plugins/tpm'
# # tmux-resurect:Persist tmux environment across system restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
# # 支持鼠标选中和复制
set -g @yank_selection_mouse 'clipboard'

# # tmux-resurect:Persist tmux environment across system restarts
#set -g @resurrect-capture-pane-contents 'on'
# # tmux-resurrect: restoring vim and neovim sessions when there is some-session.vim
# # for vim, use :Obsess to store the vim session first, then tmux will be able to restore it
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
# terminal window will go fullscreen
#set -g @continuum-boot-options 'fullscreen'

# # put this 'run' command to the very end of .tmux.conf, says tpm's markdown file
run '~/.tmux/plugins/tpm/tpm'
# # }}}

# ----------------------------------------------------------------------
# Clipboard: 通过 OSC52 与终端模拟器的系统剪贴板互通
# （2026-08-16 新增 set-clipboard；2026-08-20 实测修正）
# ----------------------------------------------------------------------
# 实测修正（2026-08-20）：
#   - 本机 DISPLAY=:0 且 X 是活的——"DISPLAY 为空"的旧判断错误。
#     但本机经 SSH 使用，:0 的 X 剪贴板在客户端看不到，所以仍然要
#     走 OSC52 而不是 xclip。
#   - copy.sh 无用且已删除绑定：xclip 分支会成功（写进 :0 的 X）后
#     exit 0，OSC52 回退分支永远不执行；且 copy-pipe 的 stdout 并不
#     会送达终端。真正干活的是下面这行 set-clipboard。
#   - copy-mode 的 y / 鼠标拖选 / Enter 默认行为已是 copy-pipe 到内置
#     buffer，set-clipboard on 时 tmux 自动向终端发 OSC52，无需任何绑定。
#
# 行为：
#   1. set-clipboard on —— copy-mode 复制后自动向终端发 OSC52；也转发
#      pane 应用（pi 的 /copy、ctrl+x 等）发出的 OSC52。
#   2. get-clipboard off —— 明确关闭 tmux 3.6+ 的剪贴板回读
#      （2026-08-20 排查期间与 escape-time 同改，验证正常后固化）。
#   3. 必须放在 tpm 之后：tmux-yank 会把 set-clipboard 设成 external
#      （只走外部工具，不转发）。
#
# 前提：终端模拟器需支持 OSC52（Windows Terminal / Alacritty / kitty /
#   Ghostty / iTerm2 均支持）。
set -g set-clipboard on
set -g get-clipboard off
